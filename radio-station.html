<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Grid - Radio Station</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        :root { --neon-teal: #008080; --neon-glow: #00f3ff; }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; margin: 0; }
        
        /* SIDEBAR (Match your screenshot) */
        .sidebar { width: 250px; background: #0a0a0a; border-right: 1px solid #1a1a1a; height: 100vh; padding: 20px; }
        .sidebar h2 { color: #8a2be2; font-size: 0.8rem; letter-spacing: 2px; }
        .nav-item { padding: 15px 0; color: #666; text-decoration: none; display: block; font-size: 0.9rem; text-transform: uppercase; }
        .nav-item.active { color: #fff; text-shadow: 0 0 10px var(--neon-glow); }

        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 40px; background: #050505; }
        .station-header { display: flex; gap: 30px; margin-bottom: 40px; }
        .cover-art { width: 200px; height: 200px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; background: #111; border-radius: 10px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #444; font-size: 0.7rem; margin-bottom: 8px; text-transform: uppercase; }
        input, textarea { 
            width: 100%; background: #0a0a0a; border: 1px solid #222; color: #fff; 
            padding: 12px; border-radius: 5px; font-family: inherit; 
        }
        
        /* THE SAVE BUTTON (The "Teal" button from your screenshot) */
        .btn-save { 
            background: var(--neon-teal); border: none; color: #000; font-weight: bold;
            padding: 15px 40px; border-radius: 5px; cursor: pointer; float: right;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-save:hover { background: var(--neon-glow); box-shadow: 0 0 20px var(--neon-glow); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <h2 style="color:#fff">THE SICK TEAM</h2>
        <p style="font-size:0.6rem; color:var(--neon-glow)">SOVEREIGN GRID</p>
        <a href="index.html" class="nav-item">Home</a>
        <a href="splitter-mastering.html" class="nav-item">Splitter / Mastering</a>
        <a href="daw.html" class="nav-item">DAW</a>
        <a href="radio-station.html" class="nav-item active">Radio Station</a>
    </nav>

    <main class="main-content">
        <div class="station-header">
            <div class="cover-art">📷</div>
            <div>
                <h1 id="display-name">107.9 W-K-O-R FM - Broadcast</h1>
                <p style="color:#666; max-width: 500px;">Broadcasting live from the epicenter of the Aetherwave Syndicate. WKOR 107.9 is the pulse of the global grid.</p>
            </div>
        </div>

        <div class="form-group">
            <label>Station Name</label>
            <input type="text" id="station-name" value="107.9 W-K-O-R FM - Broadcast">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="station-desc" rows="4">Broadcasting live from the epicenter of the Aetherwave Syndicate. WKOR 107.9 is the pulse of the global grid.</textarea>
        </div>

        <div class="form-group">
            <label>Genres (Comma Separated)</label>
            <input type="text" id="station-genres" value="Electronic, Techno, House, Funk, Parody / Comedy">
        </div>

        <button class="btn-save" onclick="triggerSync()">Save Changes 💾</button>
    </main>

    <!-- LOAD THE DISPATCHER -->
    <script src="js/broadcast-sync.js"></script>
    <script>
        async function triggerSync() {
            const name = document.getElementById('station-name').value;
            const desc = document.getElementById('station-desc').value;
            
            const payload = {
                station_name: name,
                description: desc,
                last_updated: new Date().toLocaleString()
            };

            // Call the Dispatcher Brain
            console.log("Initiating Sovereign Sync...");
            await SovereignDispatcher.syncStation('WKOR-107.9-FM', payload);
        }
    </script>
</body>
</html>
