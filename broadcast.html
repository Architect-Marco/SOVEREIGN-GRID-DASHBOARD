<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Grid - Broadcast Control</title>
    <link rel="stylesheet" href="css/shared.css"> <!-- Assuming your CSS is in /css/ -->
    <style>
        body { background: #000; color: #00f3ff; font-family: 'Courier New', monospace; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 50px; }
        .station-card { border: 1px solid #00f3ff; padding: 20px; background: #050505; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        h1 { text-shadow: 0 0 10px #00f3ff; text-align: center; }
        button { 
            background: transparent; border: 1px solid #00f3ff; color: #00f3ff; 
            padding: 10px 20px; cursor: pointer; transition: 0.3s; width: 100%;
            text-transform: uppercase; letter-spacing: 2px; margin-top: 15px;
        }
        button:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 10px; width: 90%; margin-bottom: 10px; }
        .status-light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #0f0; margin-right: 10px; box-shadow: 0 0 5px #0f0; }
    </style>
</head>
<body>

    <h1>🏛️ GLOBAL BROADCAST CONTROL</h1>

    <div class="grid-container">
        <!-- STATION 1: WKOR -->
        <div class="station-card">
            <h2><span class="status-light"></span>WKOR 107.9 FM</h2>
            <p>Current Track:</p>
            <input type="text" id="wkor-track" placeholder="Track Name...">
            <p>BPM / Mood:</p>
            <input type="text" id="wkor-meta" placeholder="128 BPM / Summer Vibe">
            <button onclick="syncWkor()">Push to Broadcast</button>
        </div>

        <!-- STATION 2: CDFM -->
        <div class="station-card">
            <h2><span class="status-light"></span>CDFM 108.8</h2>
            <p>Current Track:</p>
            <input type="text" id="cdfm-track" placeholder="Track Name...">
            <p>BPM / Mood:</p>
            <input type="text" id="cdfm-meta" placeholder="140 BPM / Dark Techno">
            <button onclick="syncCdfm()">Push to Broadcast</button>
        </div>
    </div>

    <!-- THE SOVEREIGN BRAIN LINK -->
    <script src="js/broadcast-sync.js"></script>

    <script>
        function syncWkor() {
            const data = {
                track: document.getElementById('wkor-track').value,
                meta: document.getElementById('wkor-meta').value,
                timestamp: new Date().toISOString()
            };
            // Calls the function from your js/broadcast-sync.js
            SovereignDispatcher.syncStation('WKOR-107.9-FM', data);
        }

        function syncCdfm() {
            const data = {
                track: document.getElementById('cdfm-track').value,
                meta: document.getElementById('cdfm-meta').value,
                timestamp: new Date().toISOString()
            };
            // Calls the function from your js/broadcast-sync.js
            SovereignDispatcher.syncStation('CDFM-108.8', data);
        }
    </script>
</body>
</html>
